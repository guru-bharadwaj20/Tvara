name: correctness
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: cmake --preset debug -DTVARA_SANITIZERS=ON
      - run: cmake --build --preset debug --parallel 2
      - run: ctest --preset debug
      - run: python -m pytest -q
      - run: ruff check python tests/python tools
      - run: ruff format --check python tests/python tools
      - run: python tools/audit_roadmap.py
